<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Brunos danske spil</title>
<style>
  :root { --bg: #14161c; --card: #1f232d; --fg: #f3f1ec; --dim: #a7adbb; --accent: #ffb347; color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .lead { color: var(--dim); margin: 0 0 22px; }
  .game { display: block; background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; color: inherit; text-decoration: none; border: 2px solid transparent; transition: transform .08s, border-color .15s; min-height: 44px; }
  a.game:active { transform: scale(.985); border-color: var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .name { font-size: 20px; font-weight: 800; }
  .play { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--dim); margin: 3px 0 6px; }
  .blurb { font-size: 15px; line-height: 1.4; }
  .badge { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 8px; background: #ffffff14; margin-left: 6px; }
  .game.off { opacity: .6; }
  .played { color: #3ddc84; }
  h2 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 28px 0 10px; }
</style>
</head>
<body>
<main>
  <h1>Brunos danske spil</h1>
  <p class="lead">Spil til at lære dansk · <i>Danish to Go 2</i></p>
  <div id="list"></div>
  <h2>Værktøj</h2>
  <div id="kit"></div>
</main>
<script src="games.js"></script>
<script>
  const esc = (t) => String(t).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
  function timesDone(g) {
    if (!g.save) return null;
    try { const s = JSON.parse(localStorage.getItem(g.save.key)); return s ? g.save.done(s) : null; } catch (e) { return null; }
  }
  function card(g) {
    const live = !!g.repo;
    const done = timesDone(g);
    const tag = live ? 'a' : 'div';
    const href = live ? ` href="/${esc(g.repo)}/"` : '';
    const badge = g.status === 'preview' ? '<span class="badge">preview</span>' : g.status === 'prototype' ? '<span class="badge">prototype</span>' : '';
    const meta = [g.genre, g.chapters, done ? `<span class="played">spillet ${done}×</span>` : ''].filter(Boolean).join(' · ');
    return `<${tag} class="game${live ? '' : ' off'}"${href}><div class="top"><span class="name">${esc(g.name)}${badge}</span>${live ? '<span class="play">Spil ▸</span>' : ''}</div>` +
      `<div class="meta">${meta}</div><div class="blurb">${esc(g.blurb)}</div></${tag}>`;
  }
  document.getElementById('list').innerHTML = window.GAMES.map(card).join('');
  document.getElementById('kit').innerHTML = card(Object.assign({ genre: 'Demo' }, window.KIT));
</script>
</body>
</html>
